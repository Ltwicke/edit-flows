defaults:
  - submitit_slurm

# Site placeholders, set on the command line or in config/train.yaml:
#   python train.py -m hydra/launcher=slurm slurm.account=<project> slurm.partition=<gpu partition> ...
account: ${slurm.account}
partition: ${slurm.partition}

gres: gpu:${gpus}
tasks_per_node: ${gpus}

# submitit only honours cpus_per_gpu when gpus_per_task is set, which we don't
# use because gres is more flexible.
cpus_per_task: ${eval:'1 + ${data.num_workers}'}
mem_gb: ${eval:'32 * ${gpus}'}

timeout_min: ${timeout_min}

# No requeue signal: runs resume from their periodic checkpoints when submitted again (docs/CLUSTER.md)
