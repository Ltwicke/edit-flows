# @package _global_

# Long GPU run: the deletion-base encoder, 25 000 training sequences per epoch, 300 epochs. Sized for a
# 40 GB A100 (hugefacet / greatfacet), but batch_size 128 is kept rather than raised: with the epoch
# fixed at 25 000 sequences a bigger batch buys fewer optimizer steps per epoch, not more throughput.
#   scripts/train_detached.sh long-01                        # no scheduler; all visible GPUs
#   scripts/train_detached.sh long-01 trainer.max_epochs=8   # the same setup, roughly 30 minutes
#   sbatch scripts/train.sbatch long-01                      # with SLURM
#
# Start on one GPU and let the measured epoch time decide whether more help: the per-epoch sampling
# evaluation is `sample_steps` SEQUENTIAL forward passes, so it barely gets faster with more ranks even
# though training does. notebooks/on-node-training-analysis.ipynb section 3.7 does that arithmetic.

defaults:
  - deletion-base
  - _self_

experiment:
  name: deletion-gpu-24h

data:
  path: data/synthetic/targets-60k.txt

trainer:
  # One epoch := 25 000 training sequences across ALL ranks. limit_train_batches is counted per process
  # and the DistributedSampler gives each of the `gpus` ranks its own shard, so the world size belongs in
  # the divisor: 1 GPU x 128 -> 195 batches -> 24 960 sequences; 4 GPUs x 128 -> 48 -> 24 576.
  limit_train_batches: ${eval:'25000 // (${data.batch_size} * ${gpus})'}
  max_epochs: 300
  # No max_time on purpose: lightning checkpoints the Timer state and restores it cumulatively, so a
  # resumed or chained job would stop almost immediately. Bound the job with the scheduler's time limit
  # (or just let it run) plus checkpoints/periodic.ckpt.
