# @package _global_

# text8 Edit Flow pretraining, ~180M params (Llama backbone: hidden 1024 / 12
# layers / 16 heads). This configuration approximates a downscaled version of
# the model from the paper.

gpus: 4

name: text8-180M
experiment:
  name: text8-180M

data:
  batch_size: 512
  num_workers: 7

task:
  model:
    hidden_size: 1024
    num_hidden_layers: 12
    num_attention_heads: 16
  optimizer:
    lr: 3e-4
    betas: [0.9, 0.95]
  lr_scheduler:
    warmup_steps: 2000

trainer:
  precision: bf16-mixed
  max_steps: 100000
  val_check_interval: 10000
  log_every_n_steps: 50
