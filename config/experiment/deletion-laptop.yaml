# @package _global_

# Training on a single laptop GPU (roughly 6-16 GB): the deletion-base encoder and the 25 000-sequence
# epoch, but a small batch and no dataloader workers, so it also runs on Windows.
#   python train.py experiment=deletion-laptop name=lap-01
#   python train.py experiment=deletion-laptop name=lap-01 trainer.max_epochs=2   # a quick check
#
# precision: bf16-mixed needs Ampere or newer (compute capability >= 8.0, i.e. RTX 30xx/40xx/50xx).
# On Turing or older pass trainer.precision=32 - bf16 is emulated there and fp16 is risky for this
# objective, whose rates reach exp(max_log_lambda) = exp(10).
#
# num_workers stays 0 because Windows spawns rather than forks, which would pickle the whole task into
# every worker. On Linux, data.num_workers=4 is a worthwhile speed-up.

defaults:
  - deletion-base
  - _self_

experiment:
  name: deletion-laptop

gpus: 1

data:
  path: data/synthetic/targets-60k.txt
  batch_size: 32
  eval_batch_size: 64
  num_workers: 0

task:
  eval:
    # 128 sequences in 2 batches of 64: the sampling evaluation costs
    # ceil(n_sample_seqs / eval_batch_size) * sample_steps sequential forward passes, so the batch count
    # is what matters. sample_steps stays at 100 so del_recall stays comparable with the cluster runs.
    n_sample_seqs: 128
  lr_scheduler:
    # Below one epoch (781 batches), so even trainer.max_epochs=1 leaves the cosine phase a positive
    # horizon: WarmUpCosineAnnealing uses T_max = max_steps - warmup_steps.
    warmup_steps: 300

trainer:
  precision: bf16-mixed
  devices: ${gpus}
  limit_train_batches: ${eval:'25000 // (${data.batch_size} * ${gpus})'}
  max_epochs: 30
  log_every_n_steps: 20
