# @package _global_

# GPU plumbing check on one RTX 3090 (24 GB): the deletion-base encoder and bf16-mixed, but only 512
# training sequences over two epochs (a couple of minutes). Proves the whole cluster path - environment,
# GPU memory, bf16, the deletion metrics, the run directory - before a long job is submitted. This is
# deliberately NOT the 25k-sequence epoch of deletion-3090-24h.
#   EDITFLOW_EXPERIMENT=deletion-3090-check sbatch scripts/train.sbatch gpu-check

defaults:
  - deletion-base
  - _self_

name: gpu-check
experiment:
  name: deletion-3090-check

data:
  path: data/synthetic/targets-60k.txt
  batch_size: 64
  eval_batch_size: 64

task:
  eval:
    n_sample_seqs: 32
    sample_steps: 20
  lr_scheduler:
    warmup_steps: 5

trainer:
  max_epochs: 2
  limit_train_batches: 8
  limit_val_batches: 2
  log_every_n_steps: 1
