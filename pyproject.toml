[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[project]
name = "editflows"
version = "0.2.0"
description = "Edit Flows - deletion-only edit flow for the extended coupling of known target sequences"
authors = [{ name = "Marten Lienen", email = "ml@martenlienen.com" }]
maintainers = [{ name = "Laurenz Wicke" }]
license = { text = "MIT" }
requires-python = ">=3.13"
# torch is installed separately from the PyTorch index (CPU or CUDA build), see docs/DEPENDENCIES.md
dependencies = [
  "einops==0.8.2",
  "transformers==5.14.1",
  "jaxtyping==0.3.11",
  "matplotlib==3.11.1",
  "hydra-core==1.3.4",
  "lightning==2.6.6",
  "rich==15.0.0",
  "submitit==1.5.4",
  "hydra-submitit-launcher==1.2.0",
  "numba==0.66.0",
  "openpyxl==3.1.5",
  "pandas==3.0.1",
  "tqdm==4.67.3",
]

[project.optional-dependencies]
dev = ["ipdb==0.13.13", "pytest", "ipykernel"]
wandb = ["wandb==0.28.1"]

[tool.hatch.build.targets.wheel]
packages = ["editflows"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "W", "I001"]
ignore = ["F821", "F722"]

[tool.ruff.lint.isort]
known-third-party = ["wandb"]
